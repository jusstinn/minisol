name: CI

# Every push and pull request: types, lint, tests, the offline agent eval, the catalogue
# rules and a production build. Nothing here calls OpenAI — the eval runs the scripted agent.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Route PageProps types are generated; tsc needs them before the build does.
      - run: npx next typegen
      - name: Types
        run: npm run typecheck
      - name: Lint
        run: npm run lint -- src
      - name: Tests
        run: npm test
      - name: Offline agent eval
        run: npm run eval -- --scripted
      - name: Catalogue rules
        run: npm run validate:catalog
      - name: Production build
        run: npm run build
